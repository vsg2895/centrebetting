<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="none">
  <!-- CentreBetting bonus backdrop: the page brown with one green glow from
       the top centre, the hero's own treatment. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2019"/>
      <stop offset="1" stop-color="#261b15"/>
    </linearGradient>
    <radialGradient id="glow" cx="600" cy="-40" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2bb673" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#2bb673" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2bb673" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#base)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
</svg>
